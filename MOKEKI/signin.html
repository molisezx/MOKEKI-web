<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MOKEKI demonstration sign in and sign up forms."><title>Sign In | MOKEKI</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="signin"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div><main id="main-content" class="signin-shell container"><section class="signin-card"><a href="index.html" class="signin-logo"><img src="assets/logo.svg" alt="MOKEKI — Stories That Move You"></a><div class="demo-banner" role="note"><strong>DEMONSTRATION FORM ONLY:</strong> no real account is created and no data is stored.</div><ul class="nav nav-pills signin-tabs" id="auth-tabs" role="tablist"><li class="nav-item" role="presentation"><button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel" type="button" role="tab">Sign In</button></li><li class="nav-item" role="presentation"><button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup-panel" type="button" role="tab">Sign Up</button></li></ul><div class="tab-content"><div class="tab-pane fade show active" id="login-panel" role="tabpanel" aria-labelledby="login-tab"><h1>WELCOME BACK</h1><p class="muted-copy">Your next story is waiting.</p><form id="login-form" novalidate><div class="mb-3"><label class="form-label" for="login-email">Email address</label><input class="form-control mokeki-input" id="login-email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="mb-3"><label class="form-label" for="login-password">Demo password</label><input class="form-control mokeki-input" id="login-password" type="password" required minlength="8" pattern=".{8,}" autocomplete="off" placeholder="At least 8 characters"></div><button class="btn btn-gold w-100" type="submit">Sign In</button><p id="login-feedback" class="form-feedback" aria-live="polite"></p></form></div><div class="tab-pane fade" id="signup-panel" role="tabpanel" aria-labelledby="signup-tab"><h1>JOIN THE STORY</h1><p class="muted-copy">Create a demonstration profile.</p><form id="signup-form" novalidate><div class="mb-3"><label class="form-label" for="signup-name">Display name</label><input class="form-control mokeki-input" id="signup-name" type="text" required minlength="2" autocomplete="nickname" placeholder="Your name"></div><div class="mb-3"><label class="form-label" for="signup-email">Email address</label><input class="form-control mokeki-input" id="signup-email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="mb-3"><label class="form-label" for="signup-password">Demo password</label><input class="form-control mokeki-input" id="signup-password" type="password" required minlength="8" pattern=".{8,}" autocomplete="off" placeholder="At least 8 characters"></div><div class="mb-3"><label class="form-label" for="confirm-password">Confirm demo password</label><input class="form-control mokeki-input" id="confirm-password" type="password" required minlength="8" pattern=".{8,}" autocomplete="off" placeholder="Enter password again"></div><button class="btn btn-gold w-100" type="submit">Create Demo Profile</button><p id="signup-feedback" class="form-feedback" aria-live="polite"></p></form></div></div><p class="small-note">For this university demonstration, form values are checked in your browser only. Passwords are never saved.</p></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="script.js"></script></body></html>
